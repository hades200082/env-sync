name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test the CLI
        run: |
          node dist/src/cli.js --info
          node dist/src/cli.js --file examples/envsync.json --dry-run --no-update-check --verbose
      - name: Check the package contents
        run: npm pack --dry-run
